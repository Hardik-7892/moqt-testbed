name: "queue-sweep"
description: >
  Queue size sweep across multiple topologies to measure bufferbloat impact.
  
  WHY THIS TEST: Queue size (bufferbloat) is a critical but often overlooked
  network parameter. Large queues absorb bursts but add latency (bufferbloat).
  Small queues drop packets early, triggering QUIC loss recovery. The optimal
  queue size depends on bandwidth-delay product (BDP).
  
  WHY THESE QUEUE SIZES (at 5 Mbps, 20ms RTT, BDP ~12.5 KB ~8 packets):
  - 10 packets: Below BDP, early drops, high loss
  - 20 packets: ~BDP, balanced
  - 50 packets: 2.5x BDP, mild bufferbloat
  - 100 packets: 5x BDP, significant bufferbloat
  - 200 packets: 10x BDP, severe bufferbloat
  - 500 packets: 25x BDP, extreme bufferbloat
  - 1000 packets: Default, extreme bufferbloat
  
  WHY THESE TOPOLOGIES:
  - Basic: End-to-end bufferbloat
  - Chain: Per-hop bufferbloat + inter-relay queue
  - Fanout: Multi-subscriber queue fairness
  
  DESIGN DECISIONS:
  - Fixed 5 Mbps bandwidth (creates clear BDP)
  - 20ms RTT (typical cross-region)
  - 60s duration for queue dynamics to stabilize
  - sample.mp4 for fast iteration
  
  IMPLEMENTATIONS: moq-rs (primary)
  
topology: "basic"
network_defaults:
  bw: 5
  delay: "20ms"
  loss: 0
test_duration: 60
media: "sample.mp4"
runs:
  - id: "queue-10"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 10 }
    expect: partial

  - id: "queue-20"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 20 }
    expect: pass

  - id: "queue-50"
