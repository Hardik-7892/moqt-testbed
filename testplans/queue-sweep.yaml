    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 50, max_queue_size: 1000 }
    expect: pass

  # --- Per-impl self-paths: same sweep points, comparable across impls ---
  # Bufferbloat signature per stack: throughput flat while RTT inflates.
  - id: "queue-10-moxygen-self"
    media: "sample.flv"
    test_duration: 20
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    network: { max_queue_size: 10 }
    expect: pass
    reason: "same-impl FLV baseline for cross-impl queue comparison"

  - id: "queue-100-moxygen-self"
    media: "sample.flv"
    test_duration: 20
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
