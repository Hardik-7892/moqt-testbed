    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 50 }
    expect: pass

  - id: "queue-100"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 100 }
    expect: pass

  - id: "queue-200"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 200 }
    expect: pass

  - id: "queue-500"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 500 }
    expect: pass

  - id: "queue-1000"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { max_queue_size: 1000 }
    expect: pass

  # Phase 2 validity limit: max_queue_size is applied to pub/sub wires ONLY
  # (harness/runner.py:1277 — __inter_relay__ is not in client_roles(), so the
  # inter-relay link keeps TCLink-default queue, uncontrolled). These chain rows
  # therefore measure END-TO-END bufferbloat with per-hop relay_delay, not
  # "per-hop bufferbloat + inter-relay queue". Inter-relay queue control is
  # future work (see 2_weeks/01-future-work-quarantine.md).
  - id: "queue-10-chain"
    topology: "chain"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay_a: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    relay_b: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      max_queue_size: 10
      relay_delay: "20ms"
    expect: partial

  - id: "queue-100-chain"
