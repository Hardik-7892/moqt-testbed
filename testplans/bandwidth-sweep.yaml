name: "bandwidth-sweep"
description: >
  Bandwidth sweep across multiple topologies to find throughput ceiling.
  
  WHY THIS TEST: Bandwidth is the primary constraint on MoQ delivery. The
  throughput ceiling reveals implementation bottlenecks (relay buffer, QUIC
  pacing, congestion control). Different topologies stress different parts
  of the delivery pipeline.
  
  WHY THESE BW POINTS:
  - 1, 2 Mbps: Severe constraint, tests low-bitrate behavior
  - 5, 10 Mbps: Typical broadband/cellular
  - 20, 50 Mbps: Good broadband, tests relay buffering
  - 100 Mbps: Near-link capacity, tests QUIC pacing limits
  
  WHY THESE TOPOLOGIES:
  - Basic: End-to-end throughput ceiling
  - Chain: Tests relay-to-relay forwarding bottleneck
  - Fanout: Tests multi-subscriber sharing under bandwidth pressure
  
  DESIGN DECISIONS:
  - Fixed 20ms RTT to simulate realistic cross-region
  - 60s duration to allow TCP-like ramp-up
  - sample.mp4 for fast iteration; bbb-video.mp4 for ceiling measurement
  
  IMPLEMENTATIONS: moq-rs (primary), imquic (relay/sub), moxygen (relay)
  
topology: "basic"
network_defaults:
  delay: "20ms"
  loss: 0
  max_queue_size: 1000
test_duration: 60
media: "sample.mp4"
runs:
  - id: "bw-1mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 1, delay: "20ms", loss: 0 }
    expect: pass

  - id: "bw-2mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 2, delay: "20ms", loss: 0 }
    expect: pass

  - id: "bw-5mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 5, delay: "20ms", loss: 0 }
    expect: pass

  - id: "bw-10mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 10, delay: "20ms", loss: 0 }
    expect: pass

  - id: "bw-20mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 20, delay: "20ms", loss: 0 }
    expect: pass

  - id: "bw-50mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 50, delay: "20ms", loss: 0 }
    expect: pass

  - id: "bw-100mbps-moqrs"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 100, delay: "20ms", loss: 0 }
    expect: pass

  # Phase 2 (P0-1): chain rows constrain the INTER-RELAY link via
  # devices.relay_a (topologies/chain.py:84-86). Without it, top-level bw
  # would hit the sub wire only and __inter_relay__ would stay clean —
  # any "relay-to-relay bottleneck" sentence would be false. Sub is
  # intentionally unlisted (-> CLEAN) to isolate the relay-to-relay hop.
  - id: "bw-10mbps-chain"
    topology: "chain"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay_a: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    relay_b: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 10
      delay: "20ms"
      loss: 0
      devices:
        relay_a: { bw: 10 }
    expect: pass

  - id: "bw-20mbps-chain"
    topology: "chain"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay_a: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    relay_b: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 20
      delay: "20ms"
      loss: 0
      devices:
        relay_a: { bw: 20 }
    expect: pass

  - id: "bw-50mbps-chain"
    topology: "chain"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay_a: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    relay_b: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 50
      delay: "20ms"
      loss: 0
      devices:
        relay_a: { bw: 50 }
    expect: pass

  # Phase 2 (P0-2): fanout devices.sub{i} rows are INDEPENDENT per-subscriber
  # last-mile shapers, NOT a shared bottleneck (topologies/base.py:68-71:
  # top-level bw is ignored when devices lists subs; relay stays 1000M/1ms).
  # Shared-egress approximation lives in fairness.yaml (devices.relay).
  - id: "bw-20mbps-fanout-3sub"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 50
      delay: "20ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
      devices:
        sub1: { bw: 5 }
        sub2: { bw: 5 }
        sub3: { bw: 5 }
    expect: pass

  - id: "bw-20mbps-fanout-3sub-asymmetric"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 50
      delay: "20ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
      devices:
        sub1: { bw: 2 }
        sub2: { bw: 8 }
        sub3: { bw: 10 }
    expect: pass

  - id: "bw-10mbps-fanout-4sub-bottleneck"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 50
      delay: "20ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 4
      devices:
        sub1: { bw: 2 }
        sub2: { bw: 2 }
        sub3: { bw: 2 }
        sub4: { bw: 2 }
    expect: partial

  - id: "bw-10mbps-imquic-relay"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "imquic", draft: 18, tag: "imquic/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 10, delay: "20ms", loss: 0 }
    expect: partial

  - id: "bw-10mbps-imquic-sub"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 10, delay: "20ms", loss: 0 }
    expect: partial

  - id: "bw-10mbps-moxygen-relay"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 10, delay: "20ms", loss: 0 }
    expect: partial

  - id: "bw-10mbps-moxygen-relay-imquic-sub"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 10, delay: "20ms", loss: 0 }
    expect: partial

  # --- Per-impl self-paths: same sweep points, comparable across impls ---
  - id: "bw-5mbps-moxygen-self"
    media: "sample.flv"
    test_duration: 20
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    network: { bw: 5, delay: "20ms", loss: 0 }
    expect: pass
    reason: "same-impl FLV baseline for cross-impl bandwidth comparison"

  - id: "bw-20mbps-moxygen-self"
    media: "sample.flv"
    test_duration: 20
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    network: { bw: 20, delay: "20ms", loss: 0 }
    expect: pass
    reason: "mvfst pacing under a bandwidth cap on the FLV self-path"

  - id: "bw-50mbps-moxygen-self"
    media: "sample.flv"
    test_duration: 20
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    network: { bw: 50, delay: "20ms", loss: 0 }
    expect: pass
    reason: "mvfst pacing under a bandwidth cap on the FLV self-path"

  - id: "bw-10mbps-imquic-self"
    test_duration: 20
    pub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    relay: { impl: "imquic", draft: 18, tag: "imquic/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 10, delay: "20ms", loss: 0 }
    data_check: object_receipt
    min_objects: 1
    require_draft: true
    require_integrity: false
    expect: pass
    reason: "picoquic delivery under a bandwidth cap; scored on receipt, not bytes"

  - id: "bw-50mbps-imquic-self"
    test_duration: 20
    pub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    relay: { impl: "imquic", draft: 18, tag: "imquic/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 50, delay: "20ms", loss: 0 }
    data_check: object_receipt
    min_objects: 1
    require_draft: true
    require_integrity: false
    expect: pass
    reason: "picoquic delivery under a bandwidth cap; scored on receipt, not bytes"