name: "interop-full"
description: >
  Full interop matrix for the 3 impls used in this thesis across the drafts
  they ship: moq-rs (pub, sub, relay; drafts 14/16/18), imquic (sub, relay
  only — its demo moq-pub is a clock generator that can't ingest media; drafts
  16/17/18), moxygen (relay only; drafts 14/16/18). pub is always moq-rs.
  Per-draft availability: d14 has no imquic (so sub = moq-rs only); d17 has
  no moq-rs image (so no pub → skipped); d16/d18 have the full 6-combo matrix.
  Runs whose image tags are absent on the VM fail fast with a clear image
  error; prune them to match `docker images`.
topology: "basic"
network_defaults:
  bw: 100
  delay: "10ms"
  loss: 0
  max_queue_size: 1000
test_duration: 15
runs:
  # ============================================================
  # Draft 14 — moq-rs (pub/sub/relay) + moxygen relay (no imquic at d14)
  # ============================================================
  - id: "moqrs-d14-baseline"
    pub: { impl: "moq-rs", draft: 14, tag: "moq-rs/client:14" }
    relay: { impl: "moq-rs", draft: 14, tag: "moq-rs/relay:14" }
    sub: { impl: "moq-rs", draft: 14, tag: "moq-rs/client:14" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: pass
    reason: "same-impl baseline; draft verified CONFIRMED by make verify"
  - id: "moxygen-relay-d14-baseline"
    pub: { impl: "moq-rs", draft: 14, tag: "moq-rs/client:14" }
    relay: { impl: "moxygen", draft: 14, tag: "moxygen/relay:14" }
    sub: { impl: "moq-rs", draft: 14, tag: "moq-rs/client:14" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "moxygen relay never completes a MoQ session with moq-rs clients (sub waits on server SETUP)"

  # ============================================================
  # Draft 16 — full matrix (moq-rs / imquic / moxygen relay)
  # ============================================================
  - id: "moqrs-d16-baseline"
    pub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    relay: { impl: "moq-rs", draft: 16, tag: "moq-rs/relay:16" }
    sub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: pass
    reason: "same-impl baseline; draft verified CONFIRMED by make verify"
  - id: "imquic-relay-d16-baseline"
    pub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    relay: { impl: "imquic", draft: 16, tag: "imquic/relay:16" }
    sub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "B43 framing: moq-rs pub cannot parse imquic relay SETUP (InvalidMessage)"
  - id: "imquic-sub-d16-baseline"
    pub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    relay: { impl: "moq-rs", draft: 16, tag: "moq-rs/relay:16" }
    sub: { impl: "imquic", draft: 16, tag: "imquic/cli:16" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "B43 framing: imquic sub cannot parse moq-rs relay SETUP (close 271)"
  - id: "imquic-relay-sub-d16-baseline"
    pub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    relay: { impl: "imquic", draft: 16, tag: "imquic/relay:16" }
    sub: { impl: "imquic", draft: 16, tag: "imquic/cli:16" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "B43 framing on the pub->relay leg (moq-rs pub vs imquic relay)"
  - id: "moxygen-relay-d16-baseline"
    pub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    relay: { impl: "moxygen", draft: 16, tag: "moxygen/relay:16" }
    sub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "moxygen relay never completes a MoQ session with moq-rs clients (sub waits on server SETUP)"
  - id: "moxygen-relay-imquic-sub-d16-baseline"
    pub: { impl: "moq-rs", draft: 16, tag: "moq-rs/client:16" }
    relay: { impl: "moxygen", draft: 16, tag: "moxygen/relay:16" }
    sub: { impl: "imquic", draft: 16, tag: "imquic/cli:16" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "moxygen relay never completes a MoQ session with non-moxygen clients (both legs unverified)"

  # ============================================================
  # Draft 18 — full matrix (moq-rs / imquic / moxygen relay)
  # ============================================================
  - id: "moqrs-d18-baseline"
    media: sample_1seg.mp4
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: pass
    reason: "same-impl baseline on single-segment media (B45)"
  - id: "imquic-relay-d18-baseline"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "imquic", draft: 18, tag: "imquic/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "B43 framing: moq-rs pub cannot parse imquic relay SETUP (InvalidMessage(33))"
  - id: "imquic-sub-d18-baseline"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "B43 framing: imquic sub cannot parse moq-rs relay SETUP (close 271)"
  - id: "moqrs-pub-imquic-relay-imquic-sub-d18-baseline"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "imquic", draft: 18, tag: "imquic/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "B43 framing on the pub->relay leg; re-probe candidate per the unpinned-relay finding (2026-09-05)"
  - id: "moxygen-relay-d18-baseline"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "moq-rs sub never completes a MoQ session against moxygen relay (waits forever on server SETUP)"
  - id: "moxygen-relay-imquic-sub-d18-baseline"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "imquic", draft: 18, tag: "imquic/cli:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }
    expect: fail
    reason: "moxygen relay never completes a MoQ session with non-moxygen clients (both legs unverified)"

  # ============================================================
  # Under impaired conditions (moq-rs d18 baseline)
  # ============================================================
  - id: "impair-loss1"
    media: sample_1seg.mp4
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 50, delay: "20ms", loss: 1 }
    expect: pass
    reason: "self-path under loss on single-segment media (B45)"
  - id: "impair-loss5"
    media: sample_1seg.mp4
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 50, delay: "20ms", loss: 5 }
    expect: pass
    reason: "self-path under loss on single-segment media (B45)"
  - id: "impair-delay100"
    media: sample_1seg.mp4
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 50, delay: "100ms", loss: 0 }
    expect: pass
    reason: "self-path under latency on single-segment media (B45)"
  - id: "impair-bw5"
    media: sample_1seg.mp4
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network: { bw: 5, delay: "10ms", loss: 0 }
    expect: pass
    reason: "self-path under bandwidth cap on single-segment media (B45)"
