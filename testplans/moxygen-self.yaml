name: "moxygen-self"
description: "Moxygen self-interop verify — FLV streamer pub -> moxygen relay -> FLV receiver sub"
topology: "basic"
network_defaults:
  bw: 100
  delay: "10ms"
  loss: 0
  max_queue_size: 1000
test_duration: 20
media: "bbb.flv"
runs:
  # Baseline: moxygen on itself, real FLV media through the mvfst relay.
  # Requires testdata/bbb.flv (make fetch-bbb fetch-flv) and the rebuilt
  # client image (make build-moxygen) that ships moqflvstreamerclient /
  # moqflvreceiverclient.
  - id: "moxygen-d18-baseline"
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }

  # Short-media self row (no BBB dependency): same path on sample.flv for
  # fast repeats and sweep comparability.
  - id: "moxygen-d18-sample"
    media: "sample.flv"
    pub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    relay: { impl: "moxygen", draft: 18, tag: "moxygen/relay:18" }
    sub: { impl: "moxygen", draft: 18, tag: "moxygen/client:18" }
    network: { bw: 100, delay: "10ms", loss: 0 }

  # NOTE: no d14/d16 rows on purpose. All moxygen tags are the same
  # single-commit source build (Makefile MXY_COMMIT) and the negotiated
  # draft is not wire-verifiable (found-bugs.md B46), so extra draft rows
  # would be label-only, not measurements.
