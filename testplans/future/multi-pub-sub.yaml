name: "multi-pub-sub"
description: >
  Multi-publisher / multi-subscriber scenarios with track sharing.
  
  WHY THIS TEST: Real-world MoQ deployments involve multiple publishers
  and subscribers sharing tracks through relays. This tests relay cache
  behavior, track priority, group order, and multi-party dynamics.
  
  KEY SCENARIOS:
  1. Multiple publishers to 1 relay to multiple subscribers (different tracks)
  2. 1 publisher to 2 relays (chain) to multiple subscribers
  3. 2 publishers to 1 relay to 2 subscribers (shared tracks)
  4. Asymmetric track demand (popular vs niche tracks)
  5. Chain with multiple publishers
  6. Track priority under congestion
  7. Filter types (AbsoluteStart vs RelativeStart)
  8. Group order (Publisher vs Subscriber)
  9. Asymmetric demand with congestion
  10. Chain with multiple publishers
  
  WHY THESE SCENARIOS:
  - Tests relay cache behavior (shared vs per-track)
  - Tests track priority and group order
  - Tests relay cache hit rate under multi-party load
  - Tests track priority effectiveness under congestion
  
  DESIGN DECISIONS:
  - moq-rs as primary (full pub/sub/relay support)
  - bbb-video.mp4 for sustained load (111MB)
  - 120s duration for sustained multi-party dynamics
  - Per-sub bandwidth limits to create congestion
  
  IMPLEMENTATIONS: moq-rs (primary), imquic (relay/sub), moxygen (relay)
  
topology: "fanout"
test_duration: 120
media: "bbb-video.mp4"
runs:
  - id: "3pub_3sub_different_tracks"
    topology: "fanout"
    publishers: 3
    subscribers: 3
    tracks_per_pub: 1
    tracks_per_sub: 3
    network:
      bw: 50
      delay: "10ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
      devices:
        sub1: { bw: 15 }
        sub2: { bw: 15 }
        sub3: { bw: 15 }
    expect: pass

  - id: "1pub_2relay_3sub_chain"
    topology: "chain"
    publishers: 1
    relays: 2
    subscribers: 3
    tracks: 1
    network:
      bw: 20
      delay: "20ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
      devices:
        sub1: { bw: 5 }
        sub2: { bw: 5 }
        sub3: { bw: 5 }
    expect: pass

  - id: "2pub_1relay_2sub_shared_tracks"
    topology: "fanout"
    publishers: 2
    subscribers: 2
    track_sharing: "pub1_trackA to sub1,sub2; pub2_trackB to sub1,sub2"
    network:
      bw: 30
      delay: "10ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 2
    expect: pass

  - id: "asymmetric_track_demand"
    topology: "fanout"
    publishers: 3
    subscribers: 3
    tracks:
      - name: "popular"
        publisher: 1
      - name: "niche1"
        publisher: 2
      - name: "niche2"
        publisher: 3
    network:
      bw: 20
      delay: "10ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
    expect: pass

  - id: "2pub_2relay_2sub_chain"
    topology: "chain"
    publishers: 2
    relays: 2
    subscribers: 2
    tracks_per_pub: 2
    network:
      bw: 30
      delay: "20ms"
      loss: 0
      max_queue_size: 1000
    expect: pass

  - id: "track_priority_under_congestion"
    topology: "fanout"
    publishers: 1
    subscribers: 3
    tracks:
      - name: "high_priority"
        priority: 255
      - name: "medium_priority"
        priority: 128
      - name: "low_priority"
        priority: 0
    network:
      bw: 10
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 3 }
        sub2: { bw: 3 }
        sub3: { bw: 3 }
    expect: partial

  - id: "filter_absolute_start"
    topology: "fanout"
    filter_type: "AbsoluteStart"
    start_group: 10
    num_subscribers: 3
    network:
      bw: 50
      delay: "10ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
    expect: pass

  - id: "filter_relative_start"
    topology: "fanout"
    filter_type: "RelativeStart"
    start_group: -5
    num_subscribers: 3
    network:
      bw: 50
      delay: "10ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
    expect: pass

  - id: "group_order_publisher"
    topology: "fanout"
    group_order: "Publisher"
    num_subscribers: 3
    network:
      bw: 50
      delay: "10ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
    expect: pass

  - id: "group_order_subscriber"
    topology: "fanout"
    group_order: "Subscriber"
    num_subscribers: 3
    network:
      bw: 50
      delay: "10ms"
      loss: 0
      max_queue_size: 1000
      num_subscribers: 3
    expect: pass

  - id: "asymmetric_demand_congestion"
    topology: "fanout"
    publishers: 3
    subscribers: 3
    tracks:
      - name: "popular"
        publisher: 1
      - name: "niche1"
        publisher: 2
      - name: "niche2"
        publisher: 3
    network:
      bw: 10
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 2 }
        sub2: { bw: 2 }
        sub3: { bw: 2 }
    expect: partial

  - id: "2pub_2relay_2sub_chain_congestion"
    topology: "chain"
    publishers: 2
    relays: 2
    subscribers: 2
    tracks_per_pub: 2
    network:
      bw: 20
      delay: "20ms"
      loss: 1
      max_queue_size: 100
    expect: partial

metrics:
  - per_track_throughput_mbps
  - relay_cache_hit_rate
  - relay_group_skipping_count
  - per_sub_delivery_completion_pct
  - track_priority_effectiveness
  - filter_effectiveness
  - group_divergence_symmetric_diff
  - priority_drop_rate