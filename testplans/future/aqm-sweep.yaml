name: "aqm-sweep"
description: >
  AQM (Active Queue Management) sweep across topologies.
  
  WHY THIS TEST: AQM manages queue occupancy and marks/drops packets
  to signal congestion. Different AQMs have different behaviors:
  - pfifo_fast: Simple FIFO, no active management (baseline)
  - fq_codel: Flow-queue CoDel, fair queuing + CoDel
  - cake: Common Applications Kept Enhanced, advanced AQM
  - pfifo: Simple FIFO (no CoDel)
  
  This tests how AQM choice affects MoQ delivery latency, fairness,
  and bufferbloat under congestion.
  
  WHY THESE AQMS:
  - pfifo_fast: Linux default, no AQM
  - fq_codel: Widely deployed, good general purpose
  - cake: Modern, handles diffserv, good for MoQ
  - pfifo: Simple FIFO (no CoDel)
  
  WHY THESE TOPOLOGIES:
  - Basic: End-to-end AQM effect
  - Fanout: Per-subscriber fairness under AQM
  
  DESIGN DECISIONS:
  - 5 Mbps bottleneck to create queue pressure
  - 100 packet queue (small to force AQM action)
  - 60s duration for AQM dynamics
  - sample.mp4 for fast iteration
  
  IMPLEMENTATIONS: moq-rs (primary)
  
topology: "basic"
test_duration: 60
media: "sample.mp4"
runs:
  - id: "aqm-pfifo_fast"
    aqm: "pfifo_fast"
    topology: "basic"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
    expect: pass

  - id: "aqm-fq_codel"
    aqm: "fq_codel"
    topology: "basic"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
    expect: pass

  - id: "aqm-cake"
    aqm: "cake"
    topology: "basic"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
    expect: pass

  - id: "aqm-pfifo"
    aqm: "pfifo"
    topology: "basic"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
    expect: pass

  - id: "aqm-fq_codel-fanout"
    aqm: "fq_codel"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 5 }
        sub2: { bw: 5 }
        sub3: { bw: 5 }
    expect: pass

  - id: "aqm-cake-fanout"
    aqm: "cake"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 5 }
        sub2: { bw: 5 }
        sub3: { bw: 5 }
    expect: pass

  - id: "aqm-pfifo_fast-fanout"
    aqm: "pfifo_fast"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 5
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 5 }
        sub2: { bw: 5 }
        sub3: { bw: 5 }
    expect: pass

  - id: "aqm-cake-asymmetric"
    aqm: "cake"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 50
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 10 }
        sub2: { bw: 5 }
        sub3: { bw: 2 }
    expect: pass

  - id: "aqm-fq_codel-asymmetric"
    aqm: "fq_codel"
    topology: "fanout"
    pub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    relay: { impl: "moq-rs", draft: 18, tag: "moq-rs/relay:18" }
    sub: { impl: "moq-rs", draft: 18, tag: "moq-rs/client:18" }
    network:
      bw: 50
      delay: "20ms"
      loss: 0
      max_queue_size: 100
      num_subscribers: 3
      devices:
        sub1: { bw: 10 }
        sub2: { bw: 5 }
        sub3: { bw: 2 }
    expect: pass

metrics:
  - rtt_p50_p99
  - queue_delay_ms
  - throughput_mbps
  - fairness_jain
  - queue_occupancy_p99
  - per_sub_throughput_mbps
  - per_sub_fairness_jain